linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - gocritic
    - misspell
    - bodyclose
    - noctx
    - sqlclosecheck
    - contextcheck
  disable:
    - exhaustive  # too noisy for now

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  govet:
    enable-all: true
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/pvp

issues:
  exclude-rules:
    # Allow _ in test files for mock setup
    - path: _test\.go
      linters:
        - errcheck

run:
  timeout: 5m
  go: "1.22"
