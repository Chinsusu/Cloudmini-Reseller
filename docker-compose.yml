version: "3.9"

networks:
  pvp-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  nats-data:

services:
  # ─── Infrastructure ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pvp-postgres
    networks: [pvp-net]
    environment:
      POSTGRES_USER: pvp
      POSTGRES_PASSWORD: pvp
      POSTGRES_DB: pvp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pvp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pvp-redis
    networks: [pvp-net]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    container_name: pvp-nats
    networks: [pvp-net]
    command: ["-js", "-sd", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz | grep -q ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Migrate ──────────────────────────────────────────────────────
  migrate:
    image: migrate/migrate:v4
    container_name: pvp-migrate
    networks: [pvp-net]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command: ["-path=/migrations", "-database=postgres://pvp:pvp@postgres:5432/pvp?sslmode=disable", "up"]
    restart: on-failure

  # ─── Backend Services ─────────────────────────────────────────────
  api-gateway:
    build: ./services/api-gateway
    container_name: pvp-api-gateway
    networks: [pvp-net]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      nats:     { condition: service_healthy }
      migrate:  { condition: service_completed_successfully }
    env_file: .env
    ports:
      - "8080:8080"
    restart: unless-stopped

  user-service:
    build: ./services/user-service
    container_name: pvp-user-service
    networks: [pvp-net]
    depends_on:
      postgres: { condition: service_healthy }
      nats:     { condition: service_healthy }
      migrate:  { condition: service_completed_successfully }
    env_file: .env
    ports:
      - "8081:8081"
    restart: unless-stopped

  proxy-service:
    build: ./services/proxy-service
    container_name: pvp-proxy-service
    networks: [pvp-net]
    depends_on:
      postgres: { condition: service_healthy }
      nats:     { condition: service_healthy }
      migrate:  { condition: service_completed_successfully }
    env_file: .env
    ports:
      - "8082:8082"
    restart: unless-stopped

  vps-service:
    build: ./services/vps-service
    container_name: pvp-vps-service
    networks: [pvp-net]
    depends_on:
      postgres: { condition: service_healthy }
      nats:     { condition: service_healthy }
      migrate:  { condition: service_completed_successfully }
    env_file: .env
    ports:
      - "8083:8083"
    restart: unless-stopped

  billing-service:
    build: ./services/billing-service
    container_name: pvp-billing-service
    networks: [pvp-net]
    depends_on:
      postgres: { condition: service_healthy }
      nats:     { condition: service_healthy }
      migrate:  { condition: service_completed_successfully }
    env_file: .env
    ports:
      - "8085:8085"
    restart: unless-stopped

  log-service:
    build: ./services/log-service
    container_name: pvp-log-service
    networks: [pvp-net]
    depends_on:
      postgres: { condition: service_healthy }
      nats:     { condition: service_healthy }
      migrate:  { condition: service_completed_successfully }
    env_file: .env
    ports:
      - "8087:8087"
    restart: unless-stopped

  notification-service:
    build: ./services/notification-service
    container_name: pvp-notification-service
    networks: [pvp-net]
    depends_on:
      postgres: { condition: service_healthy }
      nats:     { condition: service_healthy }
      migrate:  { condition: service_completed_successfully }
    env_file: .env
    ports:
      - "8086:8086"
    restart: unless-stopped

  reseller-service:
    build: ./services/reseller-service
    container_name: pvp-reseller-service
    networks: [pvp-net]
    depends_on:
      postgres: { condition: service_healthy }
      nats:     { condition: service_healthy }
      migrate:  { condition: service_completed_successfully }
    env_file: .env
    ports:
      - "8084:8084"
    restart: unless-stopped

  # ─── Frontend ─────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: pvp-frontend
    networks: [pvp-net]
    depends_on:
      - api-gateway
    environment:
      NEXT_PUBLIC_API_URL: http://api-gateway:8080
      NODE_ENV: production
    ports:
      - "3000:3000"
    restart: unless-stopped
