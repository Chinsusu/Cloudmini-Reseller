groups:
  - name: pvp.platform
    interval: 30s
    rules:
      # High error rate on any service
      - alert: HighHTTPErrorRate
        expr: |
          (
            sum(rate(pvp_api_gateway_http_requests_total{status=~"5.."}[5m])) /
            sum(rate(pvp_api_gateway_http_requests_total[5m]))
          ) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate on api-gateway (>5%)"
          description: "Error rate: {{ $value | humanizePercentage }}"

      # High latency (p99 > 2s)
      - alert: HighP99Latency
        expr: |
          histogram_quantile(0.99,
            rate(pvp_api_gateway_http_request_duration_seconds_bucket[5m])
          ) > 2.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P99 latency > 2s on api-gateway"
          description: "P99: {{ $value | humanizeDuration }}"

      # Circuit breaker open
      - alert: CircuitBreakerOpen
        expr: pvp_proxy_service_circuit_breaker_state == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Circuit breaker open: {{ $labels.name }}"
          description: "Proxy service circuit breaker {{ $labels.name }} has been open for 1m"

      # NATS consumer lag (consumed << published)
      - alert: NATSConsumerLag
        expr: |
          (
            sum(rate(pvp_billing_service_nats_published_total[5m])) -
            sum(rate(pvp_billing_service_nats_consumed_total{status="ok"}[5m]))
          ) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "NATS consumer lag detected"
          description: "Messages queued or being retried: {{ $value }}/min"

      # Service down (no scrape data)
      - alert: ServiceDown
        expr: up{job=~"user-service|billing-service|proxy-service|vps-service|reseller-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Prometheus cannot scrape {{ $labels.job }} on {{ $labels.instance }}"

      # Rate limit triggered frequently
      - alert: HighRateLimitRejections
        expr: |
          sum(rate(pvp_api_gateway_http_requests_total{status="429"}[5m])) * 300 > 50
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High rate of 429 Too Many Requests"
          description: "Rate limit being hit frequently: {{ $value }} req/5m"
