# Monitoring stack extension for docker-compose
# Usage: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
version: '3.9'

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: pvp-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - pvp-net

  grafana:
    image: grafana/grafana:10.4.2
    container_name: pvp-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-pvpadmin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-http://localhost:3001}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - pvp-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: pvp-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager
    networks:
      - pvp-net

  # PostgreSQL exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: pvp-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: ${DATABASE_URL:-postgresql://pvp:pvp@postgres:5432/pvp?sslmode=disable}
    networks:
      - pvp-net

  # Redis exporter
  redis-exporter:
    image: oliver006/redis_exporter:v1.59.0
    container_name: pvp-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    networks:
      - pvp-net

volumes:
  prometheus_data:
  grafana_data:
